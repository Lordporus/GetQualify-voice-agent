<svg xmlns="http://www.w3.org/2000/svg" width="320" height="64" viewBox="0 0 320 64" fill="none" role="img" aria-label="GetQualify">
  <title>GetQualify</title>
  <defs>
    <!-- userSpaceOnUse so the gradient paints reliably on thin vertical lines too -->
    <linearGradient id="rxvVolt" x1="10" y1="32" x2="320" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#34E7E4"/>
      <stop offset="0.22" stop-color="#22D3EE"/>
      <stop offset="0.60" stop-color="#6E7BFF"/>
      <stop offset="1" stop-color="#A855F7"/>
    </linearGradient>
    <linearGradient id="rxvOrb" x1="10" y1="32" x2="54" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#34E7E4"/>
      <stop offset="0.5" stop-color="#6E7BFF"/>
      <stop offset="1" stop-color="#A855F7"/>
    </linearGradient>
  </defs>

  <!-- Voltage waveform glyph inside a speech orb -->
  <circle cx="32" cy="32" r="22" fill="none" stroke="url(#rxvOrb)" stroke-width="2.2" opacity="0.55"/>
  <g stroke="url(#rxvOrb)" stroke-width="3" stroke-linecap="round">
    <line x1="21" y1="28" x2="21" y2="36"/>
    <line x1="27" y1="24" x2="27" y2="40"/>
    <line x1="32" y1="18" x2="32" y2="46"/>
    <line x1="37" y1="26" x2="37" y2="38"/>
    <line x1="43" y1="22" x2="43" y2="42"/>
  </g>

  <!-- Wordmark, single text run so the two words always sit flush -->
  <text x="66" y="42" font-family="SF Pro Display, Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif"
        font-size="27" font-weight="680" letter-spacing="-1.1"><tspan fill="#F4F6FB">Get</tspan><tspan fill="url(#rxvVolt)" dx="2">Qualify</tspan></text>
</svg>
