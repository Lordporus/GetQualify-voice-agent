name: Dashboard CI

on:
  push:
    paths:
      - "dashboard/**"
      - "schema.sql"
      - ".github/workflows/dashboard-ci.yml"
  pull_request:
    paths:
      - "dashboard/**"
      - "schema.sql"
      - ".github/workflows/dashboard-ci.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DB_DRIVER: json
      DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/postgres
      TEST_ROOT_DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/postgres
      CALENDAR_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      DOGRAH_WEBHOOK_SECRET: ci-webhook-secret-12345
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: dashboard/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Ensure PostgreSQL client tools
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Initialize PostgreSQL schema
        run: psql "$DATABASE_URL" -f ../schema.sql
      - run: pnpm test
