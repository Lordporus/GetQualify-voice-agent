name: Dashboard CI
on:
  push:
    paths:
      - "dashboard/**"
      - "schema.sql"
      - ".github/workflows/dashboard-ci.yml"
      - "deploy/**"
  pull_request:
    paths:
      - "dashboard/**"
      - "schema.sql"
      - ".github/workflows/dashboard-ci.yml"
      - "deploy/**"
  workflow_dispatch:

env:
  VPS_IP: ${{ secrets.VPS_IP }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DB_DRIVER: json
      DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/postgres
      TEST_ROOT_DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/postgres
      CALENDAR_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      DOGRAH_WEBHOOK_SECRET: ci-webhook-secret-12345
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: dashboard/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Ensure PostgreSQL client tools
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Initialize PostgreSQL schema
        run: psql "$DATABASE_URL" -f ../schema.sql
      - run: pnpm test

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && env.VPS_IP != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH credentials
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY || secrets.SSH_KEY || secrets.SSH_KEY_PATH }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "${{ secrets.VPS_IP }}" >> ~/.ssh/known_hosts 2>/dev/null || true
      - name: Deploy Dashboard to VPS
        run: bash deploy/06-deploy-dashboard.sh
        env:
          VPS_IP: ${{ secrets.VPS_IP }}
          SSH_KEY: ~/.ssh/id_deploy
          DASHBOARD_PORT: ${{ secrets.DASHBOARD_PORT || '8787' }}
          DOGRAH_HOST: ${{ secrets.DOGRAH_HOST || '' }}
          DOGRAH_BASE_URL: ${{ secrets.DOGRAH_BASE_URL || '' }}
          DOGRAH_API_KEY: ${{ secrets.DOGRAH_API_KEY || '' }}
          DOGRAH_WORKFLOW_ID: ${{ secrets.DOGRAH_WORKFLOW_ID || '' }}
          DOGRAH_TELEPHONY_CONFIG_ID: ${{ secrets.DOGRAH_TELEPHONY_CONFIG_ID || '' }}
          DOGRAH_PHONE_NUMBER_ID: ${{ secrets.DOGRAH_PHONE_NUMBER_ID || '' }}
          DOGRAH_WEBHOOK_SECRET: ${{ secrets.DOGRAH_WEBHOOK_SECRET || '' }}
          RUMIK_API_KEY: ${{ secrets.RUMIK_API_KEY || '' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || '' }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY || '' }}
          DEEPGRAM_API_KEY: ${{ secrets.DEEPGRAM_API_KEY || '' }}
          VOBIZ_NUMBER: ${{ secrets.VOBIZ_NUMBER || '' }}
          VOBIZ_AUTH_ID: ${{ secrets.VOBIZ_AUTH_ID || '' }}
          VOBIZ_AUTH_TOKEN: ${{ secrets.VOBIZ_AUTH_TOKEN || '' }}
          VOBIZ_APPLICATION_ID: ${{ secrets.VOBIZ_APPLICATION_ID || '' }}
          MSG91_AUTH_KEY: ${{ secrets.MSG91_AUTH_KEY || '' }}
          MSG91_SENDER_ID: ${{ secrets.MSG91_SENDER_ID || '' }}
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY || '' }}
          VULTR_ACCESS_KEY_ID: ${{ secrets.VULTR_ACCESS_KEY_ID || '' }}
          VULTR_SECRET_ACCESS_KEY: ${{ secrets.VULTR_SECRET_ACCESS_KEY || '' }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID || '' }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET || '' }}
          CALENDAR_ENCRYPTION_KEY: ${{ secrets.CALENDAR_ENCRYPTION_KEY || '' }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN || '' }}
